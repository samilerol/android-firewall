name: Emulator Always-on restart check
on:
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/emulator-always-on.*']
jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0"
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Always-on kill -9 check (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disk-size: 2048M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: bash .github/workflows/emulator-always-on.sh
      - name: Publish result
        if: always()
        run: |
          { echo '### Always-on restart after kill -9'; echo '```'; cat emulator-result.md 2>/dev/null || echo 'no result file'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-result
          path: emulator-result.md
          if-no-files-found: ignore
